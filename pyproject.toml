[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blobengine"
version = "1.0.0"
description = "Make blobs from a blober filter (.bna): new genomes, SVG and profile-picture PNGs."
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.8"
dependencies = ["pillow", "resvg-py"]

[project.scripts]
blobengine = "blobengine.__main__:main"

[tool.setuptools]
packages = ["blobengine"]
