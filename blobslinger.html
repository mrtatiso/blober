<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>blobslinger</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="blober">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/BagelFatOne.woff2" as="font" type="font/woff2" crossorigin>
<!--
  blobslinger: a game made of blober's blobs. Drag the blob down and away, let go, knock down the sad ones.
  The ones you liked in blober are the ones you throw (happy); the ones you got rid of come back gray and sad.
  Endless: each round is made up from its number. Your round and points live in your .bna, next to your filter,
  so the same file keeps the filter going and the game going.
  Physics: Matter.js 0.20 by Liam Brummitt (MIT), included below.
-->
<style>
@font-face{font-family:"Bagel Fat One";src:url(fonts/BagelFatOne.woff2) format("woff2");font-display:swap}   /* the font lives here, so it works offline */
/* VOICE  cute and a little cruel, as in blober
   IDEA   the same white floor, seen from the side; only figures, blobs and their shadows
   COLOUR white (or night); the blobs bring the color
   LAYOUT logo top left, "↺" and "···" top right, the blobs left bottom right, nothing else */
:root{color-scheme:light dark;--bg:light-dark(#fff,#14161a);--ink:light-dark(#1d1820,#eee9f2);--chip:light-dark(#fff,#23262c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#logo{position:fixed;left:22px;top:16px;margin:0;font:400 34px/1 "Bagel Fat One",system-ui,sans-serif;color:var(--ink);pointer-events:none}
#logo svg{display:block;height:1em;width:auto;overflow:visible}   /* the logo is drawn, not typed: no font needed */
button{font:inherit;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--chip);color:var(--ink);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
button:focus-visible{outline:3px solid #5cc96b;outline-offset:2px}
#more,#restart{position:fixed;top:12px;width:44px;padding:0;font-size:20px;line-height:1;background:transparent;box-shadow:none;opacity:.55;transition:opacity .5s}
#more{right:12px}#restart{right:58px;font-size:21px}
#more:hover,#restart:hover{opacity:1}
#menu{position:fixed;right:12px;top:58px;display:flex;flex-direction:column;gap:6px;background:var(--chip);padding:10px;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.14);width:230px}
#menu[hidden],#toast[hidden]{display:none}
#menu small{opacity:.6;padding:0 6px 4px;font-size:12px;line-height:1.5}
#menu button{min-height:40px;text-align:left}
#logo{transition:left .75s cubic-bezier(.5,0,.2,1),top .75s cubic-bezier(.5,0,.2,1),font-size .75s cubic-bezier(.5,0,.2,1),transform .75s cubic-bezier(.5,0,.2,1)}
body.start #logo{left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(64px,15vw,170px)}
#start{position:fixed;left:50%;top:calc(44% + clamp(54px,10vw,112px));transform:translateX(-50%);margin:0;font-size:17px;opacity:0;pointer-events:none;letter-spacing:.02em;white-space:nowrap;transition:opacity .4s}
body.start #start{opacity:.5;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25}}
body.start #more,body.start #restart,body.start #hud{opacity:0;pointer-events:none}
#hud{position:fixed;right:22px;bottom:max(16px,env(safe-area-inset-bottom));pointer-events:none;white-space:nowrap;transition:opacity .5s}
#left{letter-spacing:4px;font-size:15px}
#toast{position:fixed;left:50%;top:max(22px,env(safe-area-inset-top));transform:translateX(-50%);background:#1d1820;color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;max-width:92vw;text-align:center}
</style>
</head>

<script id="core">

"use strict";
// ======================================================================
// blober core: genome → creature, pieces as SVG, and a brain per part.
// No DOM here, so it can be read and tested on its own.
// ======================================================================

const VERSION = "bna1-pre";

// ---------- numbers from a seed ----------

function hash4(str) {                       // cyrb128
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0; i < str.length; i++) {
    const k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067); h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213); h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);

  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067); h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213); h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];

function seeded(seed) {                     // sfc32
  let [a, b, c, d] = hash4("blober|" + seed);
  const next = () => {
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11); c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
  for (let i = 0; i < 12; i++) next();
  return next;
}

const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
const gauss = r => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(6.2831853 * r());
const qv = v => Math.round(clamp(v) * 255) / 255;          // genes live on 256 steps, so they round-trip
const F = v => (Math.round(v * 10) / 10).toFixed(1).replace("-0.0", "0.0");

// ---------- distance fields: negative inside ----------

const circle = (x, y, cx, cy, r) => Math.hypot(x - cx, y - cy) - r;
function capsule(x, y, ax, ay, bx, by, r) {
  const vx = bx - ax, vy = by - ay;
  const t = clamp(((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy || 1));
  return Math.hypot(x - ax - vx * t, y - ay - vy * t) - r;
}
function smin(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k / 4; }
const smax = (a, b, k) => -smin(-a, -b, k);
function polygon(corners, radius) {
  return (x, y) => {
    const n = corners.length; let d = 9, pos = 0;
    for (let i = 0; i < n; i++) {
      const [ax, ay] = corners[i], [bx, by] = corners[(i + 1) % n];
      d = Math.min(d, capsule(x, y, ax, ay, bx, by, 0));
      if ((bx - ax) * (y - ay) - (by - ay) * (x - ax) >= 0) pos++;

// ---------- genome ----------
// s: 16 shape genes · f: 10 face genes · e: eye style · m: mouth style
// a: 7 arm genes (a0 = has arms) · l: 7 leg genes (l0 = has legs) · c: color

const NS = 16, NF = 10, NL = 7, NT = 8, NE = 9;   // NE: eye styles in bna1 (lentes are gone)
const PALETTE = ["#7ec8f0", "#9bd36a", "#f7a440", "#f48aa0", "#a77be0", "#ef5f57", "#5fd0c4", "#f5d14a",
                 "#c2a6f0", "#ff9e7a", "#9aa6b2", "#3d4fb5", "#3f9a83", "#6b4fb8", "#e8453c", "#f2ce3a"];
const ARMS_ON = .6, LEGS_ON = .45, ANT_ON = .55;
const LIMB_KEY = { arms: "a", legs: "l", antennas: "t" }, LIMB_ON = { arms: ARMS_ON, legs: LEGS_ON, antennas: ANT_ON };
const isOn = (part, g) => g[LIMB_KEY[part]][0] >= LIMB_ON[part];

const hexOf = arr => arr.map(v => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
const fromHex = (h, n) => Array.from({ length: n }, (_, i) => parseInt(h.slice(2 * i, 2 * i + 2), 16) / 255);
const genome = g => `s=${hexOf(g.s)} f=${hexOf(g.f)} e=${g.e} m=${g.m} t=${hexOf(g.t)} a=${hexOf(g.a)} l=${hexOf(g.l)} c=${g.c}`;

function parseGenome(line) {
  const kv = {};
  for (const t of line.trim().split(/\s+/)) { const i = t.indexOf("="); if (i > 0) kv[t.slice(0, i)] = t.slice(i + 1); }
  const hx = (k, n) => { if (!new RegExp(`^[0-9a-f]{${2 * n}}$`).test(kv[k] || "")) throw new Error(k); return fromHex(kv[k], n); };
  const int = (k, n) => { const v = Number(kv[k]); if (!(Number.isInteger(v) && v >= 0 && v < n)) throw new Error(k); return v; };

}

// ---------- shape: 16 numbers → one smooth body, endless variety ----------

function shapeParams(G) {
  const lin = (v, t) => v < t ? 0 : (v - t) / (1 - t);
  const aspect = .72 + G[0] * .66, bd = G[14] - .5;
  return {
    a: Math.sqrt(aspect), b: 1 / Math.sqrt(aspect),
    p: 2 + G[1] * G[1] * 4,                               // round → squarish
    poly: lin(G[2], .5), n: 3 + Math.floor(G[3] * 5.99),  // polygon blend, 3 to 8 sides
    taper: (G[4] - .5) * 1.0,                             // wide top ↔ wide bottom
    lobe: lin(G[5], .45) * .3, nl: 3 + Math.floor(G[6] * 9.99), sharp: .35 + G[7] * G[7] * 3.2,   // flower ↔ star

    arch: lin(G[10], .66), cleft: lin(G[11], .72),        // gap underneath · heart dip on top
    wob: G[12] * G[12] * .13, ph: G[13] * 6.2832,         // blobby wobble

  };

const FAMILY_GENES = { poly: [2, .5], lobe: [5, .45], ears: [8, .62], arch: [10, .66], cleft: [11, .72] };

function famOf(s) {
  const P = shapeParams(s);
  if (P.lobe) return P.sharp > 1.5 ? "estrella" : "flor";
  if (P.arch) return "arco";
  if (P.cleft) return "corazón";
  if (P.poly > .45) return P.n === 3 ? "triángulo" : P.n === 4 ? "cuadro" : "polígono";
  if (P.ears) return "orejas";
  if (P.bend) return "frijol";
  return "bola";

  const archR = (.1 + arch * .2) * a, archTop = b * (1 - arch * 1.0), cleftR = .13 + cleft * .2;
  return (x0, y0) => {
    const yb = y0 - bend * x0 * x0 + bend * .35;
    let x = x0, y = yb;
    const t = Math.atan2(y, x);
    let m = 1;
    if (amp) m += amp * (Math.pow(.5 + .5 * Math.cos(nl * (t - rotL)), sharp) - .45);
    if (wob) m += (1 - Math.min(.8, lobe * 3)) * wob * (Math.cos(2 * t + ph) * .6 + Math.cos(3 * t + ph * 1.7) * .4 + Math.cos(5 * t + ph * 2.3) * .2);
    x /= m; y /= m;
    const tx = x / Math.max(.4, 1 + taper * y);
    const tt = Math.atan2(y, tx), c = Math.abs(Math.cos(tt)) / a, s = Math.abs(Math.sin(tt)) / b;
    let d = Math.hypot(tx, y) - Math.pow(Math.pow(c, p) + Math.pow(s, p), -1 / p);
    if (polyF) d = d * (1 - poly) + polyF(tx, y) * poly;
    d *= m;
    if (ears) { d = smin(d, circle(x0, yb, ex, ey, earR), .22); if (ex) d = smin(d, circle(x0, yb, -ex, ey, earR), .22); }

// ---------- outline: marching squares, smooth, even points ----------

// ---------- drawing ----------

const wob = (A, t) => A * Math.exp(-t * 7) * Math.cos(t * 30);   // a squash that rings out
function poseOf(b) {                                      // how a blob in the world moves its parts right now
  const sad = b.L.sad, scared = b.fright > 0, wee = b.kind === "player" && b.wee > 0 && b.speed > 2;
  const t = T, ph = b.ph, q = wob(b.sqA, b.sqT);
  const br = Math.sin(t * (sad ? 1.3 : 2.2) + ph) * (sad ? .025 : .015);
  let arm, leg = 0, ant = Math.sin(t * 2.6 + ph) * .12;
  if (b.cheer > 0) { arm = -1.15 + Math.sin(t * 16 + ph) * .35; leg = Math.sin(t * 16 + ph) * .2; ant += Math.sin(t * 14) * .2; }
  else if (wee) { arm = -1 + Math.sin(t * 9 + ph) * .25; leg = .25; ant = -b.velocity.x * .03; }   // thrown: arms up, a happy "wee"
  else if (scared) { arm = -.9 + Math.sin(t * 12 + ph) * .45; leg = Math.sin(t * 14 + ph) * .35; ant += Math.sin(t * 10 + ph) * .3; }
  else if (sad) { arm = .5 + Math.sin(t * 1.1 + ph) * .08; ant = Math.sin(t * 1.2 + ph) * .06; }   // arms hanging, antennas still
  else arm = Math.sin(t * 1.7 + ph) * .1;
  return { scared: scared && !b.cheer, lx: b.lx, ly: b.ly, shut: b.shut > 0, glad: b.cheer > 0 && !sad, t, sx: 1 + q, sy: 1 - q + br, arm, leg, ant };
}
function drawBlob(b) {
  const hop = b.cheer > 0 && b.speed < 1.5 ? Math.abs(Math.sin(b.cheer * 9)) * 9 : 0;   // glad: little jumps
  drawCreature(b.L, b.cx, b.cy, b.scale, poseOf(b), mR(mT(TF, b.position.x, b.position.y - hop), b.angle));
}
function shadow(x, h, w) {                                 // shadows never stack: they are drawn solid into one layer, toned once
  if (!(h > -4) || !(w > 0) || !isFinite(x)) return;
  const k = 1 / (1 + Math.max(0, h) / 300);
  ctx.moveTo(x + w * k, G + 2); ctx.ellipse(x, G + 2, w * k, w * .22 * k, 0, 0, 6.283);
}
function shadowsBegin() { ctx.beginPath(); }
function shadowsEnd() { ctx.globalAlpha = NIGHT ? .4 : .12; ctx.fillStyle = "#000"; ctx.fill("nonzero"); ctx.globalAlpha = 1; }
function drawBlock(b) {
  ctx.beginPath();
  if (b.shape === "circle") ctx.arc(b.position.x, b.position.y, b.circleRadius, 0, 6.283);
  else { b.vertices.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.closePath(); }
  ctx.globalAlpha = .3 + .7 * Math.max(0, b.hp) / b.max; ctx.fillStyle = matFill(b.mat); ctx.fill(); ctx.globalAlpha = 1;
}
function drawCurrent() {                                  // standing on the band: feet on the contact point
  if (!current) return;
  const L = current.L, B = body(current.g.s);
  const c = state === "landing" ? { x: SLING.x, y: SLING.y + current.dy } : aiming ? pull : { x: SLING.x, y: SLING.y + wobble() + current.dy };
  const dx = SLING.x - pull.x, dy = SLING.y - pull.y, l = Math.hypot(dx, dy) || 1, k = aiming ? clamp((pull.y - SLING.y - TAUT) / (MAXPULL - TAUT)) : 0;
  const q = wob(current.sqA, current.sqT), t = T, inAir = current.dy < -1, cheer = current.cheer > 0;
  const P = {
    scared: false, lx: 0, ly: 0, t, shut: (current.shut > 0 && !aiming) || k > .7, glad: cheer,
    sx: 1 + q + k * .22, sy: 1 - q - k * .26 + Math.sin(t * 2.2) * .012,   // pulled down: it squashes on the band, ready to go
    arm: cheer ? -1.15 + Math.sin(t * 16) * .35 : aiming ? -.4 - k * .7 + Math.sin(t * 20) * .08 * k : inAir || state === "landing" ? -.8 : Math.sin(t * 3) * .12,
    leg: inAir ? .18 : aiming ? -.15 * k : 0, ant: Math.sin(t * 2.6) * .12 + (inAir ? .15 : 0) + k * .3,
  };
  const M = mR(mT(TF, c.x, c.y - 2), aiming && k > 0 ? clamp(-dx / l, -1, 1) * .25 * k : 0);   // leans the way it will go
  drawCreature(L, L.cx, B.maxY, S, P, M);
}
function drawAim() {
  if (!aiming || !current || pull.y - SLING.y <= TAUT) return;
  const B = body(current.g.s);
  let x = pull.x, y = pull.y - (B.maxY - (B.minY + B.maxY) / 2) * S, vx = (SLING.x - pull.x) * POWER, vy = (SLING.y - pull.y) * POWER;
  const g = engine.gravity.y * engine.gravity.scale * (1000 / 60) ** 2;
  ctx.fillStyle = NIGHT ? "#eee9f2" : "#1d1820";
  for (let i = 1; i <= 75; i++) {
    vx *= 1 - FA; vy = vy * (1 - FA) + g; x += vx; y += vy;
    if (y > G && vy > 0) break;
    if (i % 4 === 0) { ctx.globalAlpha = .35 * (1 - i / 80); ctx.beginPath(); ctx.arc(x, y, 3.2 / Math.max(.6, cam.k / KB), 0, 6.283); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life -= dt * (q.ring ? 2.4 : 1.1); if (q.life <= 0) { parts.splice(i, 1); continue; }
    if (q.ring) { q.r += dt * 260; ctx.globalAlpha = q.life * .6; ctx.strokeStyle = q.color || "#9aa6b2"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.stroke(); continue; }
    if (q.conf) {
      q.vy = Math.min(q.vy + 14 * dt, 2.2); q.vx *= Math.pow(.3, dt); q.vx += Math.sin(q.life * 9 + q.spin) * .08;
      q.x += q.vx * dt * 60; q.y += q.vy * dt * 60; q.life -= dt * .25;
      ctx.globalAlpha = Math.min(1, q.life * 2); ctx.fillStyle = q.color;
      put(mS(mR(mT(TF, q.x, q.y), q.spin + q.life * 4), 1, Math.cos(q.life * 14 + q.spin))); ctx.fillRect(-q.r, -q.r * .55, q.r * 2, q.r * 1.1);
      continue;
    }
    q.vy += 18 * dt; q.x += q.vx * dt * 60; q.y += q.vy * dt * 60; if (q.y > G) { q.y = G; q.vy *= -.3; q.vx *= .7; }
    ctx.globalAlpha = Math.min(1, q.life * 2); ctx.fillStyle = q.color;
    put(mR(mT(TF, q.x, q.y), q.spin += dt * 6)); ctx.fillRect(-q.r, -q.r * .7, q.r * 2, q.r * 1.4);
  }
  put(TF); ctx.globalAlpha = 1;
}
function draw(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = NIGHT ? "#14161a" : "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = shake > .3 ? (rand() - .5) * shake : 0, sy = shake > .3 ? (rand() - .5) * shake : 0; shake *= Math.pow(.02, dt);
  TF = [DPR * cam.k, 0, 0, DPR * cam.k, DPR * (SW / 2 - cam.x * cam.k + sx), DPR * (FLOOR_AT() - cam.y * cam.k + sy)];
  put(TF);
  const bodies = Composite.allBodies(world).filter(b => !b.isStatic);
  shadowsBegin();
  for (const b of bodies) shadow(b.position.x, G - b.bounds.max.y, (b.bounds.max.x - b.bounds.min.x) * (b.kind === "block" ? .5 : .45));
  if (current) { const B = body(current.g.s), y = aiming ? pull.y : SLING.y + current.dy;
    if (y <= G + 2) shadow(aiming ? pull.x : SLING.x, Math.max(0, G - y), (B.maxX - B.minX) * S * .45); }
  shadowsEnd();
  for (const b of bodies) if (b.kind === "block") drawBlock(b);
  for (const b of bodies) if (b.kind === "target") drawBlob(b);
  for (const b of bodies) if (b.kind === "player") drawBlob(b);
  drawCurrent();
  drawAim();
  if (!shot && state === "ready" && !aiming && !document.body.classList.contains("start")) {
    ctx.textAlign = "center"; ctx.font = `${22 / (cam.k / KB)}px system-ui, sans-serif`; ctx.fillStyle = NIGHT ? "rgba(238,233,242,.5)" : "rgba(29,24,32,.5)";
    ctx.fillText("drag down and let go", SLING.x, SLING.y - 150);
  }
  drawFx(dt);
}

// ---------- the pin, as in blober: when the next one to jump is off screen, a pin of its color at the edge points to it ----------
let pin = null;
function drawPin() {
  pin = null;
  if (!current) return;
  const B = body(current.g.s), wy = (aiming ? pull.y : SLING.y + current.dy) - (B.maxY - B.minY) * S / 2, wx = aiming ? pull.x : SLING.x;
  const sx = (wx - cam.x) * cam.k + SW / 2, sy = (wy - cam.y) * cam.k + FLOOR_AT(), m = 30;
  if (sx > -m && sx < SW + m && sy > -m && sy < SH + m) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const cx = SW / 2, cy = SH / 2, inset = Math.min(56, SW * .08, SH * .08), dx = sx - cx, dy = sy - cy;
  const k = Math.min((cx - inset) / Math.abs(dx || 1e-6), (cy - inset) / Math.abs(dy || 1e-6));
  const x = cx + dx * k, y = cy + dy * k, r = 9, a = Math.atan2(dy, dx), L = r * 2.1, b = Math.acos(r / L);
  ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * L, y + Math.sin(a) * L); ctx.arc(x, y, r, a + b, a - b + Math.PI * 2); ctx.closePath();
  ctx.globalAlpha = .75; ctx.fillStyle = PALETTE[current.g.c]; ctx.fill();
  ctx.globalAlpha = .6; ctx.strokeStyle = NIGHT ? "#000" : "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.globalAlpha = .85; ctx.fillStyle = NIGHT ? "#14161a" : "#fff"; ctx.beginPath(); ctx.arc(x, y, r * .38, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
  pin = { x, y };
}

let last = performance.now(), acc = 0; const perf = { sum: 0, n: 0, ceil: 1.01, until: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  const raw = now - last, dt = Math.min(.05, raw / 1000); last = now;
  if (raw < 250 && !document.hidden) { perf.sum += raw; perf.n++; }
  if (perf.n >= 90) {                                     // every ~1.5 s: too slow → fewer pixels; plenty of time → back up
    const avg = perf.sum / perf.n, top = Math.min(2, devicePixelRatio || 1);
    if (now > perf.until) perf.ceil = 1;                  // a level that was too slow is not tried again for a while (no flicker back and forth)
    let q = QUAL;
    if (avg > 21) { perf.ceil = QUAL; perf.until = now + 20000; q = Math.max(.5 / top, QUAL * .8); }
    else if (avg < 17.5 && QUAL * 1.12 < perf.ceil) q = Math.min(1, QUAL * 1.12);
    if (false && Math.abs(q - QUAL) > .01) { QUAL = q; resize(); }   // never lower the resolution: it stays sharp
    perf.sum = perf.n = 0;
  } acc += dt; T = now / 1000; NIGHT = nightNow();
  let n = 0; while (acc >= 1 / 60 && n < 3) { step(1 / 60); acc -= 1 / 60; n++; }   // never more than 3 catch-up steps: no spiral on a slow device
  if (n === 3) acc = 0;
  frameCamera(dt);
  rasterSome(n ? 3 : 6);
  try { draw(dt); drawPin(); } catch (e) { ctx.globalAlpha = 1; console.warn(e); }
}
addEventListener("pagehide", keep);
if (matchMedia("(pointer: coarse)").matches) $("start").textContent = "tap to play";
window.sling = { engine, world, state: () => state, alive, progress: () => progress, cam, good: () => good, bad: () => bad,
  launchAt: (dx, dy) => { if (state !== "ready") return false; pull = { x: SLING.x - dx, y: SLING.y - dy }; launch(); return true; },
  goRound: n => { progress.round = n; startRound(); }, toScreen: (x, y) => ({ x: (x - cam.x) * cam.k + SW / 2, y: (y - cam.y) * cam.k + FLOOR_AT() }) };
for (let i = 0; i < 6; i++) spare.push(makeRandom());
startRound();
idle(prepare);
cam.x = cam.tx; cam.k = KB;
requestAnimationFrame(frame);
</script>
