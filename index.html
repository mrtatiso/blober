<!--
  blober: blober is the filter. Double click the floor and one falls somewhere. Left click drags; one click is a pat;
  a double click sends it off in hearts ("more of this"). Right click scares; a double right click kills it
  ("no more of this"), and the more you clean, the worse the way to go. On touch screens: tap = a pat, double tap = a fright,
  hold and slide to ♥ or 💔; two fingers zoom.
-->
<style>
@font-face{font-family:"Bagel Fat One";src:url(fonts/BagelFatOne.woff2) format("woff2");font-display:swap}   /* the font lives here, so it works offline */
/* VOICE  cute and a little cruel: everything soft until something blows up
   IDEA   an endless white floor, nothing drawn on it; only the blobs and their shadows
   PICTURE the whole screen is the pen
   COLOUR white; the blobs bring the color; fire and lightning bring the fright
   LAYOUT logo top left, "···" top right, nothing else */
:root{color-scheme:light dark;--bg:light-dark(#fff,#14161a);--ink:light-dark(#1d1820,#eee9f2);--chip:light-dark(#fff,#23262c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#logo{position:fixed;left:22px;top:16px;margin:0;font:400 34px/1 "Bagel Fat One",system-ui,sans-serif;color:var(--ink);pointer-events:none}
#logo svg{display:block;height:1em;width:auto;overflow:visible}   /* the logo is drawn, not typed: no font needed */
button{font:inherit;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--chip);color:var(--ink);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
button:focus-visible{outline:3px solid #5cc96b;outline-offset:2px}
#more{position:fixed;right:12px;top:12px;width:44px;padding:0;font-size:20px;line-height:1;background:transparent;box-shadow:none;opacity:.55}
#more:hover{opacity:1}
#menu{position:fixed;right:12px;top:58px;display:flex;flex-direction:column;gap:6px;background:var(--chip);padding:10px;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.14);width:230px}
#menu[hidden],#toast[hidden]{display:none}
#menu small{opacity:.6;padding:0 6px 4px;font-size:12px;line-height:1.5}
#menu button{min-height:40px;text-align:left}
#logo{transition:left .75s cubic-bezier(.5,0,.2,1),top .75s cubic-bezier(.5,0,.2,1),font-size .75s cubic-bezier(.5,0,.2,1),transform .75s cubic-bezier(.5,0,.2,1)}
body.start #logo{left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(72px,17vw,190px)}
#start{position:fixed;left:50%;top:calc(44% + clamp(60px,11vw,124px));transform:translateX(-50%);margin:0;font-size:17px;opacity:0;pointer-events:none;letter-spacing:.02em;white-space:nowrap;transition:opacity .4s}
body.start #start{opacity:.5;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25}}
body.start #more{opacity:0;pointer-events:none}
#more{transition:opacity .5s}
#rules{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,16,24,.3);padding:16px}
#rules[hidden]{display:none}
#rules .card{position:relative;background:var(--chip);color:var(--ink);border-radius:22px;padding:22px 24px 18px;width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.22)}
#rules h2{margin:0 0 14px;font:400 30px/1 "Bagel Fat One",system-ui,sans-serif}
#rules .keys{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#rules .keys li{display:grid;grid-template-columns:28px 5.2em 1fr;align-items:center;gap:12px}
#rules .keys i{font-style:normal;font-size:21px;line-height:1;display:grid;place-items:center}
#rules .keys i svg{width:26px;height:26px}
#rules .keys b{font-weight:700}
#rules .keys span{opacity:.65;text-align:right}
#rules[data-on=mouse] .keys[data-for=touch],#rules[data-on=touch] .keys[data-for=mouse]{display:none}   /* only the controls of the device you are on */
#rules .link{min-height:0;padding:0;background:none;box-shadow:none;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
#rules p{margin:16px 0 0;font-size:13px;opacity:.6;line-height:1.5}
#rulesX{position:absolute;right:10px;top:10px;width:40px;min-height:40px;padding:0;font-size:24px;line-height:1;background:transparent;box-shadow:none;opacity:.55}
#rulesX:hover{opacity:1}
#play{position:fixed;right:58px;top:12px;width:44px;padding:0;font-size:17px;line-height:1;background:transparent;box-shadow:none;opacity:.55;transition:opacity .5s}
#play:hover{opacity:1}
body.start #play{opacity:0;pointer-events:none}
#games{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,16,24,.3);padding:16px}
#games[hidden]{display:none}
#radial{position:fixed;inset:0;pointer-events:none;z-index:5}
#radial[hidden]{display:none}
#radial i{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--chip);box-shadow:0 3px 14px rgba(0,0,0,.18);display:grid;place-items:center;transform:scale(.4);opacity:0;transition:transform .16s cubic-bezier(.3,1.6,.5,1),opacity .12s}
#radial.on i{transform:scale(1);opacity:1}
#radial i.pick{transform:scale(1.3)}
#radial svg{width:34px;height:34px}
#games .card{position:relative;background:var(--chip);color:var(--ink);border-radius:22px;padding:22px 24px 20px;width:min(420px,100%);box-shadow:0 10px 40px rgba(0,0,0,.22)}
#games h2{margin:0 0 14px;font:400 30px/1 "Bagel Fat One",system-ui,sans-serif}
#games .game{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:12px 16px;border-radius:16px;text-align:left;margin-top:8px}
#games .game b{font:400 22px/1.1 "Bagel Fat One",system-ui,sans-serif}
#games .game span{font-size:13px;opacity:.65}
#games .game[disabled]{opacity:.4;cursor:default;box-shadow:none}
#gamesX{position:absolute;right:10px;top:10px;width:40px;min-height:40px;padding:0;font-size:24px;line-height:1;background:transparent;box-shadow:none;opacity:.55}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d1820;color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;max-width:92vw;text-align:center}
</style>

<script id="core">

"use strict";
// ======================================================================
// blober core: genome → creature, pieces as SVG, and a brain per part.
// No DOM here, so it can be read and tested on its own.
// ======================================================================

const VERSION = "bna1-pre";

// ---------- numbers from a seed ----------

function hash4(str) {                       // cyrb128
  let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
  for (let i = 0; i < str.length; i++) {
    const k = str.charCodeAt(i);
    h1 = h2 ^ Math.imul(h1 ^ k, 597399067); h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
    h3 = h4 ^ Math.imul(h3 ^ k, 951274213); h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
  }
  h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067); h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
  h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213); h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
  return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
}

function seeded(seed) {                     // sfc32
  let [a, b, c, d] = hash4("blober|" + seed);
  const next = () => {
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11); c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
  for (let i = 0; i < 12; i++) next();
  return next;
}

const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
const gauss = r => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(6.2831853 * r());
const qv = v => Math.round(clamp(v) * 255) / 255;          // genes live on 256 steps, so they round-trip
const F = v => (Math.round(v * 10) / 10).toFixed(1).replace("-0.0", "0.0");

// ---------- distance fields: negative inside ----------

const circle = (x, y, cx, cy, r) => Math.hypot(x - cx, y - cy) - r;
function capsule(x, y, ax, ay, bx, by, r) {
  const vx = bx - ax, vy = by - ay;
  const t = clamp(((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy || 1));
  return Math.hypot(x - ax - vx * t, y - ay - vy * t) - r;
}
function smin(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k / 4; }
const smax = (a, b, k) => -smin(-a, -b, k);
function polygon(corners, radius) {
  return (x, y) => {
    const n = corners.length; let d = 9, pos = 0;
    for (let i = 0; i < n; i++) {
      const [ax, ay] = corners[i], [bx, by] = corners[(i + 1) % n];
      d = Math.min(d, capsule(x, y, ax, ay, bx, by, 0));
      if ((bx - ax) * (y - ay) - (by - ay) * (x - ax) >= 0) pos++;
    }
    return (pos === n || pos === 0 ? -d : d) - radius;
  };
}

// ---------- genome ----------
// s: 16 shape genes · f: 10 face genes · e: eye style · m: mouth style
// a: 7 arm genes (a0 = has arms) · l: 7 leg genes (l0 = has legs) · c: color

const NS = 16, NF = 10, NL = 7, NT = 8, NE = 9;   // NE: eye styles in bna1 (lentes are gone)
const PALETTE = ["#7ec8f0", "#9bd36a", "#f7a440", "#f48aa0", "#a77be0", "#ef5f57", "#5fd0c4", "#f5d14a",
                 "#c2a6f0", "#ff9e7a", "#9aa6b2", "#3d4fb5", "#3f9a83", "#6b4fb8", "#e8453c", "#f2ce3a"];
const ARMS_ON = .6, LEGS_ON = .45, ANT_ON = .55;
const LIMB_KEY = { arms: "a", legs: "l", antennas: "t" }, LIMB_ON = { arms: ARMS_ON, legs: LEGS_ON, antennas: ANT_ON };
const isOn = (part, g) => g[LIMB_KEY[part]][0] >= LIMB_ON[part];

const hexOf = arr => arr.map(v => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
const fromHex = (h, n) => Array.from({ length: n }, (_, i) => parseInt(h.slice(2 * i, 2 * i + 2), 16) / 255);
const genome = g => `s=${hexOf(g.s)} f=${hexOf(g.f)} e=${g.e} m=${g.m} t=${hexOf(g.t)} a=${hexOf(g.a)} l=${hexOf(g.l)} c=${g.c}`;

function parseGenome(line) {
  const kv = {};
  for (const t of line.trim().split(/\s+/)) { const i = t.indexOf("="); if (i > 0) kv[t.slice(0, i)] = t.slice(i + 1); }
  const hx = (k, n) => { if (!new RegExp(`^[0-9a-f]{${2 * n}}$`).test(kv[k] || "")) throw new Error(k); return fromHex(kv[k], n); };
  const int = (k, n) => { const v = Number(kv[k]); if (!(Number.isInteger(v) && v >= 0 && v < n)) throw new Error(k); return v; };
  return { s: hx("s", NS), f: hx("f", NF), e: int("e", NE), m: int("m", 10), t: hx("t", NT), a: hx("a", NL), l: hx("l", NL), c: int("c", PALETTE.length) };
}

// ---------- shape: 16 numbers → one smooth body, endless variety ----------

function shapeParams(G) {
  const lin = (v, t) => v < t ? 0 : (v - t) / (1 - t);
  const aspect = .72 + G[0] * .66, bd = G[14] - .5;
  return {
    a: Math.sqrt(aspect), b: 1 / Math.sqrt(aspect),
    p: 2 + G[1] * G[1] * 4,                               // round → squarish
    poly: lin(G[2], .5), n: 3 + Math.floor(G[3] * 5.99),  // polygon blend, 3 to 8 sides
    taper: (G[4] - .5) * 1.0,                             // wide top ↔ wide bottom
    lobe: lin(G[5], .45) * .3, nl: 3 + Math.floor(G[6] * 9.99), sharp: .35 + G[7] * G[7] * 3.2,   // flower ↔ star
    ears: lin(G[8], .62), earSpread: G[9],
    arch: lin(G[10], .66), cleft: lin(G[11], .72),        // gap underneath · heart dip on top
    wob: G[12] * G[12] * .13, ph: G[13] * 6.2832,         // blobby wobble

// ---------- a folder of its own: the filter is written there as blober.bna on every change ----------
